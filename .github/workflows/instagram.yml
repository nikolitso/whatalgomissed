name: Post films to Instagram

on:
  push:
    branches: [main]
    paths:
      - "content/films/*.md"
  schedule:
    # Backlog films three times a week (Mon, Wed, Fri) at ~14:17 UTC (UK afternoon, US East morning).
    # GitHub sometimes drops scheduled runs, so there are two backups an hour apart;
    # a backup only posts if nothing went out in the last 20 hours.
    - cron: "17 14 * * 1,3,5"
    - cron: "17 15 * * 1,3,5"
    - cron: "17 16 * * 1,3,5"
  workflow_dispatch:       # "Run workflow" button: posts the next film from the backlog now

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: Post
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: "17841433673760498"   # @whatalgomissed (public ID, not a secret)
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ]; then echo "INSTAGRAM_TOKEN secret is not set"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then
            NEW=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'content/films/*.md' || true)
            if [ -z "$NEW" ]; then echo "no new films"; exit 0; fi
            python scripts/instagram_post.py new $NEW
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/instagram_post.py daily --force
          else
            python scripts/instagram_post.py daily
          fi
      - name: Remember what was posted
        if: always()
        run: |
          git add content/instagram_posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Instagram: record posted films [skip ci]"
            git pull --rebase -q && git push -q
          fi

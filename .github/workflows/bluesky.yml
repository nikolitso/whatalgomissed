name: Post films to Bluesky

on:
  push:
    branches: [main]
    paths:
      - "content/films/*.md"
  schedule:
    # Older films twice a day, timed for Europe + the US (times in UTC):
    # ~14:17 = UK afternoon / US East morning; ~00:17 = US evening.
    # GitHub sometimes drops scheduled runs, so each slot has two backups an hour apart;
    # a backup only posts if nothing went out in the last 4 hours.
    - cron: "17 14 * * *"
    - cron: "17 15 * * *"
    - cron: "17 16 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:       # "Run workflow" button: posts the next film from the backlog

permissions:
  contents: write

concurrency:
  group: bluesky
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          BLUESKY_HANDLE: whatalgomissed.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -z "$BLUESKY_APP_PASSWORD" ]; then echo "BLUESKY_APP_PASSWORD secret is not set"; exit 0; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            NEW=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'content/films/*.md' || true)
            if [ -z "$NEW" ]; then echo "no new films"; exit 0; fi
            sleep 150   # let Cloudflare publish the page so the link card has its image
            python scripts/bluesky_post.py new $NEW
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/bluesky_post.py daily --force   # the button always posts
          else
            python scripts/bluesky_post.py daily
          fi
      - name: Remember what was posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add content/bluesky_posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Bluesky: record posted films [skip ci]"
            git pull --rebase -q && git push -q
          fi

name: Post Reels to Instagram

on:
  schedule:
    # One Reel a day at ~19:17 UTC (Europe evening, US lunchtime).
    # GitHub sometimes drops scheduled runs, so two backups an hour apart;
    # a backup only posts if no Reel went out in the last 18 hours.
    - cron: "17 19 * * *"
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:       # "Run workflow" button: posts the next Reel now

permissions:
  contents: write

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pillow imageio-ffmpeg
      - name: Post Reel
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: "17841433673760498"   # @whatalgomissed (public ID, not a secret)
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$INSTAGRAM_TOKEN" ] || [ -z "$TMDB_TOKEN" ]; then echo "INSTAGRAM_TOKEN or TMDB_TOKEN secret is not set"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/instagram_reel_post.py --force
          else
            python scripts/instagram_reel_post.py
          fi
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add content/instagram_reels_posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Instagram: record posted Reels [skip ci]"
            git pull --rebase -q && git push -q
          fi
